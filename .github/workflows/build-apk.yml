name: Build Shizuku Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.0"

      - name: Build Shizuku Manager debug APK
        run: ./gradlew --no-daemon --stacktrace :manager:assembleDebug

      - name: Upload Shizuku Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-manager-cache-clear-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
